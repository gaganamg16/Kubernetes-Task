
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: webapp-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: webapp-html
          configMap:
            name: webapp-html